name: Sapporo Chuo Info - 09:00 JST

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-and-notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Collect and send LINE
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO_USER_ID: ${{ secrets.LINE_TO_USER_ID }}
          MAX_ITEMS: "8"
          MAX_STORE: "300"
        run: python collector.py

      - name: Commit updated data
        run: |
          git config user.name "sapporo-chuo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/items.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update collected items [skip ci]"
            git push
          fi
